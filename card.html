<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KEMS | Digital business card</title>
  <meta name="description" content="Connect with KEMS. Save our contact details or share yours.">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://getkems.com/card.html">
  <meta property="og:title" content="Connect with KEMS">
  <meta property="og:description" content="Save our contact details or share yours.">
  <meta property="og:image" content="https://getkems.com/kems-logo2.png">
  <link rel="icon" href="/mirror-icon2-192.png">
  <style>
    :root { color-scheme:light; --bg:#f4f4f4; --card:#fff; --text:#222; --muted:#656565; --border:#d8d8d8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 "Courier New",Courier,monospace; padding:calc(24px + env(safe-area-inset-top,0px)) 20px max(28px,env(safe-area-inset-bottom,0px)); }
    body.dark { color-scheme:dark; --bg:#010101; --card:#0b0b0b; --text:#e6eef6; --muted:#a0a0a0; --border:#393939; }
    a { color:inherit; }
    nav, main { max-width:440px; margin:auto; }
    nav a { font-size:14px; text-decoration:none; }
    main { margin-top:36px; background:var(--card); border-radius:12px; padding:28px; box-shadow:0 6px 24px #0b0c0e0f; }
    #card-photo { display:block; width:110px; height:90px; object-fit:contain; margin:4px auto 24px; }
    #card-photo.portrait { width:96px; height:96px; object-fit:cover; border-radius:50%; }
    h1 { text-align:center; font-size:28px; line-height:1.2; margin:0; overflow-wrap:anywhere; }
    .identity { text-align:center; color:var(--muted); margin:8px 0 24px; }
    .identity[hidden] { display:none; }
    #card-links { display:grid; gap:12px; margin:24px 0; }
    #card-links a { text-decoration:none; overflow-wrap:anywhere; }
    #card-links a:hover { text-decoration:underline; }
    .actions { display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px; }
    .actions button { min-width:0; padding:12px 8px; font-size:clamp(11px,3.2vw,13px); white-space:nowrap; }
    button, .button { min-height:46px; padding:12px 16px; font:inherit; font-size:15px; border:1px solid var(--text); border-radius:7px; cursor:pointer; background:var(--text); color:var(--card); text-align:center; text-decoration:none; }
    button.secondary { background:transparent; color:var(--text); }
    button:disabled { opacity:.6; cursor:wait; }
    button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--text); outline-offset:3px; }
    #contact-form { margin-top:28px; border-top:1px solid var(--border); padding-top:20px; }
    #contact-form[hidden] { display:none; }
    h2 { font-size:20px; margin:0 0 20px; }
    label { display:block; font-size:14px; margin-top:14px; }
    input, textarea { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); }
    textarea { resize:vertical; min-height:92px; }
    .consent { display:flex; align-items:flex-start; gap:10px; line-height:1.45; margin:20px 0; }
    .consent input { flex:none; width:18px; height:18px; margin:1px 0 0; accent-color:var(--text); }
    .form-note { font-size:12px; color:var(--muted); }
    #contact-form button { width:100%; }
    .trap { position:absolute; left:-9999px; }
    .status:empty { display:none; }
    .status { margin:16px 0 0; font-size:14px; overflow-wrap:anywhere; }
    .sharing { display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:24px; padding-top:20px; border-top:1px solid var(--border); }
    #card-qr { display:block; width:204px; max-width:100%; height:auto; border-radius:8px; }
    .sharing a { font-size:12px; }
    @media(max-width:360px) { body { padding-left:12px; padding-right:12px; } main { padding:22px; } }
  </style>
  <script src="card.js" defer></script>
</head>
<body>
  <nav><a href="/" aria-label="Back">‹ Back</a></nav>
  <main>
    <img id="card-photo" src="/kems-logo2.png" alt="KEMS">
    <h1 id="card-name" hidden></h1>
    <div class="identity" hidden><div id="card-role"></div></div>
    <div id="card-links"><a href="mailto:hello@getkems.com">hello@getkems.com</a></div>
    <div class="actions">
      <button id="save-contact" type="button">Save Contact</button>
      <button id="show-contact-form" class="secondary" type="button" aria-expanded="false" aria-controls="contact-form">Share your details</button>
    </div>
    <p id="card-status" class="status" role="status" aria-live="polite"></p>
    <form id="contact-form" hidden>
      <h2>Share your details</h2>
      <label for="contact-name">Name</label><input id="contact-name" name="name" autocomplete="name" maxlength="120" required>
      <label for="contact-email">Email</label><input id="contact-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required>
      <label for="contact-phone">Phone (optional)</label><input id="contact-phone" name="phone" type="tel" autocomplete="tel" maxlength="50">
      <label for="contact-company">Company (optional)</label><input id="contact-company" name="company" autocomplete="organization" maxlength="120">
      <label for="contact-note">Message (optional)</label><textarea id="contact-note" name="note" maxlength="1000"></textarea>
      <div class="trap" aria-hidden="true"><label for="contact-website">Website</label><input id="contact-website" name="website" tabindex="-1" autocomplete="off"></div>
      <label class="consent"><input name="join_waitlist" type="checkbox"><span>Join the KEMS waitlist for updates and early access. You can unsubscribe anytime.</span></label>
      <button type="submit">Share details</button>
      <p class="form-note">Your details will be shared with KEMS and stored in its contact list.</p>
      <p id="contact-status" class="status" role="status" aria-live="polite"></p>
    </form>
    <div class="sharing">
      <img id="card-qr" src="card-qr.png" alt="QR code opening the KEMS digital business card" width="370" height="370"><a href="card-qr.png" download="KEMS-card-QR.png">Download QR code</a>
    </div>
  </main>
</body>
</html>
