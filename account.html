<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>My Mirror Account</title>
<style>
  :root{
    --bg:#000; --card:#111; --card2:#161616; --text:#eee; --muted:#aaa;
    --line:#2a2a2a; --accent:#0d6efd; --danger:#dc3545;
  }
  *{box-sizing:border-box}
  html,body{background:#000}
  body{margin:0;min-height:100vh;background:transparent;color:var(--text);
    font-family:-apple-system,'SF Pro Text',system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow-x:hidden}
  .bg-pattern{position:fixed;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;
    animation:bg-pattern-drift 32s ease-in-out infinite;transform-origin:center}
  @keyframes bg-pattern-drift{0%{transform:translate(0%,0%) scale(1.04) rotate(0deg)}20%{transform:translate(1.1%,-0.7%) scale(1.07) rotate(.3deg)}40%{transform:translate(1.8%,.5%) scale(1.1) rotate(.15deg)}60%{transform:translate(.5%,1.2%) scale(1.07) rotate(-.25deg)}80%{transform:translate(-1.1%,.6%) scale(1.05) rotate(-.35deg)}100%{transform:translate(0%,0%) scale(1.04) rotate(0deg)}}
  @media(prefers-reduced-motion:reduce){.bg-pattern{animation:none}}
  .card{position:relative;z-index:1;width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:28px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .tabs{display:flex;gap:8px;margin-bottom:20px}
  .tab{flex:1;padding:10px;text-align:center;border-radius:10px;background:var(--card2);
    border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer}
  .tab.active{color:#fff;background:var(--accent);border-color:var(--accent)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;
    background:var(--card2);color:var(--text);padding:0 12px;font:16px inherit}
  input:focus{outline:none;border-color:var(--accent)}
  button.primary{width:100%;min-height:46px;margin-top:20px;border:0;border-radius:10px;
    background:var(--accent);color:#fff;font:600 15px inherit;cursor:pointer}
  button.primary:disabled{opacity:.5;cursor:default}
  .error{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:16px}
  .msg{color:#4caf50;font-size:13px;margin-top:10px;min-height:16px}
  .hidden{display:none !important}
  .mirror-row{display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line)}
  .mirror-row:last-child{border-bottom:0}
  .mirror-row span.name{font-weight:600}
  .mirror-row span.id{display:block;color:var(--muted);font-size:11px}
  .signout{margin-top:24px;background:transparent;border:1px solid var(--line);
    color:var(--muted);width:100%;min-height:40px;border-radius:10px;cursor:pointer}
  .forgot{margin-top:10px;font-size:12px;color:var(--accent);text-align:right;cursor:pointer}
  .mirror-actions{display:flex;gap:8px}
  .mirror-actions button{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:8px;min-height:32px;padding:0 10px;font-size:12px;cursor:pointer}
  .mirror-actions button.danger{color:#ff6b6b;border-color:#5a2020}
  .rename-input{width:100%;min-height:36px;margin-top:4px}
</style>
</head>
<body>
<img class="bg-pattern" src="onboarding.png" alt="" aria-hidden="true">

  <!-- AUTH VIEW -->
  <div class="card" id="auth-card">
    <h1>Your Mirror Account</h1>
    <p class="sub">Sign in or create an account to manage your mirrors.</p>
    <div class="tabs">
      <div class="tab active" data-mode="login">Log In</div>
      <div class="tab" data-mode="signup">Sign Up</div>
    </div>
    <form id="auth-form">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password" minlength="6">
      <button class="primary" id="auth-submit" type="submit">Log In</button>
      <p class="forgot" id="forgot-link">Forgot password?</p>
      <p class="error" id="auth-error"></p>
      <p class="msg" id="auth-msg"></p>
    </form>
  </div>

  <!-- DASHBOARD VIEW -->
  <div class="card hidden" id="dashboard-card">
    <h1>My Mirrors</h1>
    <p class="sub" id="user-email"></p>

    <div id="mirror-list"></div>

    <label for="pair-code">Add a Mirror</label>
    <input id="pair-code" placeholder="6-digit code shown on your mirror" maxlength="6">
    <button class="primary" id="pair-submit" type="button">Link Mirror</button>
    <p class="error" id="pair-error"></p>
    <p class="msg" id="pair-msg"></p>

    <button class="signout" id="sign-out" type="button">Sign Out</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── Fill these in from Supabase Dashboard → Settings → API ──
  const SUPABASE_URL = 'https://qnrdrtlsitedelrzkdvd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qXLe8UMrN62miUoIxZJoiQ_7tQfoapm';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const authCard = document.getElementById('auth-card');
  const dashCard = document.getElementById('dashboard-card');
  const authForm = document.getElementById('auth-form');
  const authError = document.getElementById('auth-error');
  const authMsg = document.getElementById('auth-msg');
  const authSubmit = document.getElementById('auth-submit');
  const tabs = document.querySelectorAll('.tab');
  let mode = 'login';

  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    authSubmit.textContent = mode === 'login' ? 'Log In' : 'Sign Up';
    authError.textContent = '';
    authMsg.textContent = '';
  }));

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authError.textContent = '';
    authMsg.textContent = '';
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    authSubmit.disabled = true;
    try {
      if (mode === 'login') {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await showDashboard();
      } else {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        authMsg.textContent = 'Account created — check your email to confirm, then log in.';
      }
    } catch (err) {
      authError.textContent = err.message || 'Something went wrong.';
    } finally {
      authSubmit.disabled = false;
    }
  });

  document.getElementById('forgot-link').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    authError.textContent = '';
    authMsg.textContent = '';
    if (!email) { authError.textContent = 'Enter your email above first.'; return; }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href,
    });
    if (error) authError.textContent = error.message;
    else authMsg.textContent = 'Password reset email sent — check your inbox.';
  });

  document.getElementById('sign-out').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    dashCard.classList.add('hidden');
    authCard.classList.remove('hidden');
  });

  document.getElementById('pair-submit').addEventListener('click', async () => {
    const pairError = document.getElementById('pair-error');
    const pairMsg = document.getElementById('pair-msg');
    pairError.textContent = '';
    pairMsg.textContent = '';
    const code = document.getElementById('pair-code').value.trim();
    if (!code) { pairError.textContent = 'Enter the code shown on your mirror.'; return; }

    const { data: { user } } = await supabaseClient.auth.getUser();

    // Find the unclaimed pairing row with this code.
    const { data: rows, error: findErr } = await supabaseClient
      .from('pairing_codes')
      .select('device_id, claimed_at')
      .eq('code', code)
      .is('claimed_at', null)
      .limit(1);

    if (findErr || !rows || rows.length === 0) {
      pairError.textContent = 'Invalid or expired code.';
      return;
    }
    const deviceId = rows[0].device_id;

    // Claim it: mark it claimed by this user.
    const { error: claimErr } = await supabaseClient
      .from('pairing_codes')
      .update({ user_id: user.id, claimed_at: new Date().toISOString() })
      .eq('code', code)
      .is('claimed_at', null);
    if (claimErr) { pairError.textContent = claimErr.message; return; }

    // Register the mirror under this account.
    const { error: insertErr } = await supabaseClient
      .from('mirrors')
      .insert({ device_id: deviceId, user_id: user.id, name: 'My Mirror' });
    if (insertErr) { pairError.textContent = insertErr.message; return; }

    pairMsg.textContent = 'Mirror linked!';
    document.getElementById('pair-code').value = '';
    loadMirrors();
  });

  async function loadMirrors() {
    const list = document.getElementById('mirror-list');
    const { data, error } = await supabaseClient.from('mirrors').select('*').order('paired_at', { ascending: false });
    if (error) { list.innerHTML = ''; return; }
    if (!data || data.length === 0) {
      list.innerHTML = '<p class="sub">No mirrors linked yet.</p>';
      return;
    }
    list.innerHTML = data.map(m => `
      <div class="mirror-row" data-id="${m.id}">
        <span><span class="name">${m.name}</span><span class="id">Mirror ${m.mirror_number ?? ''} · ${m.device_id}</span></span>
        <span class="mirror-actions">
          <button type="button" class="rename-btn">Rename</button>
          <button type="button" class="danger remove-btn">Remove</button>
        </span>
      </div>
    `).join('');

    list.querySelectorAll('.rename-btn').forEach(btn => {
      btn.addEventListener('click', () => startRename(btn.closest('.mirror-row')));
    });
    list.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', () => removeMirror(btn.closest('.mirror-row')));
    });
  }

  function startRename(row) {
    const id = row.dataset.id;
    const currentName = row.querySelector('.name').textContent;
    row.innerHTML = `
      <input class="rename-input" type="text" value="${currentName}">
      <span class="mirror-actions">
        <button type="button" class="save-btn">Save</button>
        <button type="button" class="cancel-btn">Cancel</button>
      </span>
    `;
    row.querySelector('.cancel-btn').addEventListener('click', loadMirrors);
    row.querySelector('.save-btn').addEventListener('click', async () => {
      const newName = row.querySelector('.rename-input').value.trim();
      if (!newName) return;
      await supabaseClient.from('mirrors').update({ name: newName }).eq('id', id);
      loadMirrors();
    });
  }

  async function removeMirror(row) {
    const id = row.dataset.id;
    const name = row.querySelector('.name')?.textContent || 'this mirror';
    if (!confirm(`Remove ${name} from your account?`)) return;
    await supabaseClient.from('mirrors').delete().eq('id', id);
    loadMirrors();
  }

  async function showDashboard() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;
    document.getElementById('user-email').textContent = user.email;
    authCard.classList.add('hidden');
    dashCard.classList.remove('hidden');
    loadMirrors();
  }

  // On load, check if already signed in (persisted session).
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) await showDashboard();
  })();
</script>
</body>
</html>
